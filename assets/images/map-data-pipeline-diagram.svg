<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" role="img" aria-labelledby="title description">
  <title id="title">Map data pipeline</title>
  <desc id="description">Sources connect to shared jobs, state, artifacts, and audit trail. Separate food and BuiltHere runtimes use adapters and plugins. A Pizza Michigan, TacoBoutMichigan, and BuiltHere.city each own review and publishing.</desc>
